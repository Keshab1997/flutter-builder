  <text x="550" y="431" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#43516d">Manual when you choose · Secrets stay in GitHub</text>
  <text x="550" y="451" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64728c">আপনার পছন্দমতো চালান · Secret GitHub-এই রাখুন</text>
