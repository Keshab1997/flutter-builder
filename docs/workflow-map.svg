<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 470" role="img" aria-labelledby="title desc">
  <title id="title">Flutter Builder workflow map</title>
  <desc id="desc">Choose one of five workflow lanes for code checks, UI debugging, web preview, screenshots, or releases. English and Bengali labels are shown.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f7ff"/>
      <stop offset="1" stop-color="#eef8ff"/>
    </linearGradient>
    <linearGradient id="app" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4338ca"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
  </defs>
  <rect width="1100" height="470" rx="28" fill="url(#bg)"/>
  <text x="550" y="42" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="700" fill="#18233b">One Flutter app · choose the workflow you need</text>
  <text x="550" y="68" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#526078">একটি Flutter অ্যাপ · কাজ অনুযায়ী workflow বেছে নিন</text>

  <rect x="405" y="88" width="290" height="64" rx="18" fill="url(#app)"/>
  <text x="550" y="116" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="700" fill="#fff">FLUTTER APP REPOSITORY</text>
  <text x="550" y="137" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#e7ebff">Flutter অ্যাপের repository</text>

  <path d="M550 152v35M140 187h820" fill="none" stroke="#aeb9d2" stroke-width="2"/>
  <path d="M140 187v22M345 187v22M550 187v22M755 187v22M960 187v22" fill="none" stroke="#aeb9d2" stroke-width="2"/>
  <circle cx="140" cy="187" r="4" fill="#7c83e8"/>
  <circle cx="345" cy="187" r="4" fill="#ed7092"/>
  <circle cx="550" cy="187" r="4" fill="#20a78a"/>
  <circle cx="755" cy="187" r="4" fill="#3986df"/>
  <circle cx="960" cy="187" r="4" fill="#d99022"/>

