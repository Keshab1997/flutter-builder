name: Reusable Flutter Web Preview Deployment

# Builds the caller's Flutter app for the web and deploys it to GitHub Pages
# under a per-branch path, so a push gives you a clickable browser URL instead
# of an APK download. Meant for quick manual testing on a phone/laptop without
# installing anything: open the URL, log in to the app, poke around.
#
# This is a *build preview*, not a debugging session: there is no hot reload
# here. For hot reload in the browser while developing, run locally:
#
#   flutter run -d chrome
#
# One-time setup in the caller repository:
#   Settings -> Pages -> Build and deployment -> Deploy from a branch ->
#   select the gh-pages branch (root). The first preview push creates it.
#
# Notes:
# - The caller MUST pass `secrets: inherit` (the deploy uses GITHUB_TOKEN).
# - Plugins without a web implementation (camera, bluetooth, ...) will not
#   work here; the preview is only as good as the app's web support.
# - Each branch gets its own directory (preview/<branch>), so several previews
#   can coexist. Old hashed assets linger in that directory between pushes;
#   harmless, but if that bothers you, delete the directory on gh-pages.
# - `set-about-link: true` keeps the repository's About -> Website link on the
#   preview of the default branch (see the README). Off by default because it
#   needs a credential with administration: write, which GITHUB_TOKEN is not.
# - The release web deploy in flutter-build.yml (deploy-web-pages) publishes
#   to the Pages root and wipes other files. If a caller uses both, a release
#   web deploy removes preview/<branch> directories until the next push
#   recreates them.

on:
  workflow_call:
    inputs:
      working-directory:
        description: Flutter project directory inside the caller repository
        required: false
        type: string
        default: "."
      flutter-channel:
        description: Flutter channel (stable, beta, or master)
        required: false
        type: string
        default: stable
      destination-dir:
        description: Directory on the gh-pages branch (empty = preview/<branch>)
        required: false
        type: string
        default: ""
      base-href:
        description: Base href baked into the build (empty = auto from destination-dir)
        required: false
        type: string
        default: ""
      comment-on-pr:
        description: Post or update a PR comment containing the preview URL
        required: false
        type: boolean
        default: true
      set-about-link:
        description: Point the repository's About -> Website link at the preview (needs an admin credential)
        required: false
        type: boolean
        default: false
      about-link-url:
        description: URL for the About link (empty = the preview URL of this run)
        required: false
        type: string
        default: ""
      about-link-overwrite:
        description: Replace an About link that already points somewhere else
        required: false
        type: boolean
        default: false
      app-id:
        description: GitHub App id used to mint an admin token for the About link
        required: false
        type: string
        default: ""
    secrets:
      ABOUT_LINK_TOKEN:
        description: Fine-grained PAT with Administration write, used for the About link
        required: false
      APP_PRIVATE_KEY:
        description: Private key of the GitHub App named by app-id, used for the About link
        required: false
    outputs:
      preview-url:
        description: Browser URL of the deployed preview
        value: ${{ jobs.preview.outputs.preview-url }}

permissions:
  contents: write
  pull-requests: write

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      preview-url: ${{ steps.paths.outputs.url }}
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory }}

    steps:
      - name: Checkout caller project
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ inputs.flutter-channel }}
          cache: true

      - name: Verify web platform exists
        run: |
          if [ ! -d web ]; then
            echo "::error::No web/ directory found in: $PWD"
            echo "Add the web platform once with: flutter create --platforms web ."
            exit 1
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Compute preview path and URL
        id: paths
        env:
          REF_NAME: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
          DESTINATION_DIR: ${{ inputs.destination-dir }}
          BASE_HREF: ${{ inputs.base-href }}
        run: |
          set -euo pipefail

          repo="${GITHUB_REPOSITORY#*/}"

          # Branch names can contain characters that do not belong in a URL
          # path (and pull/<n>/merge refs appear in some events); sanitize to
          # [a-z0-9-].
          safe="$(printf '%s' "$REF_NAME" | tr '[:upper:]' '[:lower:]' | sed -E 's#[^a-z0-9-]+#-#g; s#^-+##; s#-+$##')"
          [ -n "$safe" ] || safe="branch"

          dest_dir="${DESTINATION_DIR:-preview/${safe}}"
          base_href="${BASE_HREF:-/${repo}/${dest_dir}/}"
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          url="https://${owner}.github.io/${repo}/${dest_dir}/"

          {
            echo "dest-dir=${dest_dir}"
            echo "base-href=${base_href}"
            echo "url=${url}"
          } >> "$GITHUB_OUTPUT"

          echo "Preview: ${url}"

      - name: Build web bundle
        run: flutter build web --release --base-href "${{ steps.paths.outputs.base-href }}"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ${{ inputs.working-directory }}/build/web
          destination_dir: ${{ steps.paths.outputs.dest-dir }}
          # Keep other branches' previews alive next to this one.
          keep_files: true

      # The preview URL otherwise lives only in this run's summary, which
      # nobody opens. One index page per repository - …/<repo>/preview/ - is
      # what makes the previews findable; it is refreshed by every deploy, and
      # a failure here must never fail a deploy that already published.
      - name: Check out this builder (for the preview hub script)
        if: inputs.destination-dir == ''
        uses: actions/checkout@v5
        with:
          repository: Keshab1997/flutter-builder
          # The hub script ships with the preview workflow, so both come from
          # the same tag (tests/test_preview_hub.py holds the pins in step).
          ref: v1.10.0
          path: .flutter-builder

      - name: Refresh the preview hub index
        if: inputs.destination-dir == ''
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash "$GITHUB_WORKSPACE/.flutter-builder/scripts/preview-hub.sh" \
            --branch-dir "${{ steps.paths.outputs.dest-dir }}"

      - name: Add preview URL to the step summary
        run: |
          {
            echo "## Web preview"
            echo ""
            echo "Open in a browser: ${{ steps.paths.outputs.url }}"
            if [ "${{ inputs.destination-dir }}" = "" ]; then
              echo ""
              echo "All previews: https://${{ github.repository_owner }}.github.io/${GITHUB_REPOSITORY#*/}/preview/"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment preview URL on the pull request
        if: inputs.comment-on-pr && github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.paths.outputs.url }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const marker = "<!-- flutter-builder:web-preview -->";
            const url = process.env.PREVIEW_URL;
            const sha = process.env.COMMIT_SHA;
            const body = [
              marker,
              "### Web preview",
              "",
              `${url}`,
              "",
              `Built from ${sha.slice(0, 8)}.`
            ].join("\n");

            const issue_number = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo,
              issue_number,
            });
            const existing = comments.find((c) => (c.body || "").includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number,
                body,
              });
            }

  # Keeps the repository's About -> Website link on the preview, so the project
  # page and the app both lead to a place where the app can be tried in a
  # browser. Opt-in (`set-about-link: true`) because it needs a credential with
  # administration: write - GITHUB_TOKEN cannot edit repository settings. Either
  # a GitHub App (`app-id` input + APP_PRIVATE_KEY secret) or a fine-grained PAT
  # (ABOUT_LINK_TOKEN secret) with Administration: write on this repository.
  about-link:
    name: About link
    if: >-
      inputs.set-about-link &&
      github.event_name == 'push' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: preview
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Resolve the About-link credential
        id: credentials
        env:
          APP_ID_INPUT: ${{ inputs.app-id }}
          HAS_APP_KEY: ${{ secrets.APP_PRIVATE_KEY != '' }}
          HAS_TOKEN: ${{ secrets.ABOUT_LINK_TOKEN != '' }}
        run: |
          set -euo pipefail

          source=none
          if [ -n "$APP_ID_INPUT" ] && [ "$HAS_APP_KEY" = "true" ]; then
            source=app
          elif [ "$HAS_TOKEN" = "true" ]; then
            source=token
          fi
          echo "source=$source" >> "$GITHUB_OUTPUT"

          case "$source" in
            app)
              echo "Using GitHub App ${APP_ID_INPUT} to set the About link."
              ;;
            token)
              echo "Using the ABOUT_LINK_TOKEN secret to set the About link."
              ;;
            *)
              echo "The About link was left alone: no credential found."
              echo "::notice::Add the APP_PRIVATE_KEY secret and the app-id input, or an ABOUT_LINK_TOKEN secret with Administration: write, to keep the About link on the preview."
              {
                echo "### About link"
                echo ""
                echo "No credential found, so the About link was left alone. See \"About -> Website link\" in the README."
              } >> "$GITHUB_STEP_SUMMARY"
              ;;
          esac

      - name: Create an installation token for the app
        id: app-token
        if: steps.credentials.outputs.source == 'app'
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ inputs.app-id }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Point the About link at the preview
        if: steps.credentials.outputs.source != 'none'
        env:
          GH_TOKEN: ${{ steps.credentials.outputs.source == 'app' && steps.app-token.outputs.token || secrets.ABOUT_LINK_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          TARGET_URL: ${{ inputs.about-link-url != '' && inputs.about-link-url || needs.preview.outputs.preview-url }}
          OVERWRITE: ${{ inputs.about-link-overwrite }}
        run: |
          set -euo pipefail

          # Attempts and the pause between them are env knobs so the self-test can
          # run this exact script without the real waiting.
          attempts="${ABOUT_LINK_ATTEMPTS:-6}"
          retry_seconds="${ABOUT_LINK_RETRY_SECONDS:-5}"

          if [ -z "${TARGET_URL:-}" ]; then
            echo "::warning::No preview URL to point the About link at, so nothing was changed."
            exit 0
          fi

          # The Pages deployment needs a moment before the URL answers.
          live=false
          for attempt in $(seq 1 "$attempts"); do
            code="$(curl -s -o /dev/null -w '%{http_code}' -L --max-time 20 "$TARGET_URL" || true)"
            if [ "$code" = "200" ]; then
              live=true
              break
            fi
            echo "Attempt ${attempt}/${attempts}: ${TARGET_URL} answered ${code:-nothing}. Retrying."
            sleep "$((attempt * retry_seconds))"
          done
          if [ "$live" != "true" ]; then
            echo "::warning::${TARGET_URL} did not answer 200, so the About link was left alone."
            {
              echo "### About link"
              echo ""
              echo "\`${TARGET_URL}\` is not live yet, so the About link was left alone."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          current="$(gh api "/repos/${REPOSITORY}" --jq '.homepage // ""')"
          if [ "$current" = "$TARGET_URL" ]; then
            echo "The About link already points at ${TARGET_URL}."
            {
              echo "### About link"
              echo ""
              echo "Already points at \`${TARGET_URL}\`; nothing to change."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Never silently throw away a real website that the owner put there.
          if [ -n "$current" ] && [ "$OVERWRITE" != "true" ]; then
            echo "::warning::The About link already points at ${current}; leaving it alone. Set about-link-overwrite: true to replace it."
            {
              echo "### About link"
              echo ""
              echo "Left \`${current}\` alone; set \`about-link-overwrite: true\` if the preview should replace it."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          gh api --method PATCH "/repos/${REPOSITORY}" -f "homepage=${TARGET_URL}" > /dev/null
          updated="$(gh api "/repos/${REPOSITORY}" --jq '.homepage // ""')"
          if [ "$updated" != "$TARGET_URL" ]; then
            echo "::error::The About link is still ${updated:-empty} after the update."
            exit 1
          fi

          echo "About link: ${current:-empty} -> ${TARGET_URL}"
          {
            echo "### About link"
            echo ""
            echo "Updated from \`${current:-empty}\` to \`${TARGET_URL}\`."
          } >> "$GITHUB_STEP_SUMMARY"
