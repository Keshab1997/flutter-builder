name: Test one-command installer
on:
  push:
    branches: [main]
    paths:
      - scripts/**
      - tests/**
      - .github/workflows/installer-tests.yml
  pull_request:
    paths:
      - scripts/**
      - tests/**
      - .github/workflows/installer-tests.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Shell syntax
        run: bash -n scripts/install.sh
      - name: ShellCheck (warnings and errors only)
        run: shellcheck -S warning scripts/*.sh
      - name: Installer integration tests (no Flutter SDK required)
        run: python3 -m unittest discover -s tests -v
