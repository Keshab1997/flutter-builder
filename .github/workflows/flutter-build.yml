name: Reusable Flutter Build

on:
  workflow_call:
    inputs:
      flutter-channel:
        description: Flutter channel (stable, beta, or master)
        required: false
        type: string
        default: stable
      java-version:
        description: Java version used for Android builds
        required: false
        type: string
        default: "17"
      working-directory:
        description: Flutter project directory inside the caller repository
        required: false
        type: string
        default: "."
      generate-android-platform:
        description: Generate the Android platform when the caller project has no android directory
        required: false
        type: boolean
        default: false
      android-organization:
        description: Reverse-domain organization used when generating Android files
        required: false
        type: string
        default: com.example
      run-format-check:
        description: Check Dart formatting
        required: false
        type: boolean
        default: true
      run-analyze:
        description: Run flutter analyze
        required: false
        type: boolean
        default: true
      run-tests:
        description: Run flutter test when the test directory exists
        required: false
        type: boolean
        default: true
      build-apk:
        description: Build a release APK
        required: false
        type: boolean
        default: false
      build-aab:
        description: Build a signed release AAB
        required: false
        type: boolean
        default: false
      dart-defines:
        description: >-
          Compile-time Dart defines for the APK/AAB, one KEY=VALUE per line
          (each becomes --dart-define=KEY=VALUE; blank values are skipped so the
          app's own default applies). Not for secrets - the values end up in the binary.
        required: false
        type: string
        default: ""
      build-env:
        description: >-
          Environment variables exported for the build steps, one KEY=VALUE per
          line (e.g. a value Gradle reads for an AndroidManifest placeholder).
        required: false
        type: string
        default: ""
      artifact-retention-days:
        description: Number of days to keep build artifacts
        required: false
        type: number
        default: 14
      publish-github-release:
        description: Create a version tag and GitHub Release with English release notes
        required: false
        type: boolean
        default: false
      release-name:
        description: Product name used in the GitHub Release title and asset filenames
        required: false
        type: string
        default: ""
      release-tag:
        description: Optional Git tag; defaults to v<version-name> from pubspec.yaml
        required: false
        type: string
        default: ""
      release-draft:
        description: Create the GitHub Release as a draft
        required: false
        type: boolean
        default: false
      release-prerelease:
        description: Mark the GitHub Release as a prerelease
        required: false
        type: boolean
        default: false
      # ---------------------------------------------------------------
      # Validation and quality gates
      # ---------------------------------------------------------------
      code-coverage:
        description: Run flutter test with coverage and report the percentage
        required: false
        type: boolean
        default: false
      upload-coverage-codecov:
        description: Upload the coverage report to Codecov (CODECOV_TOKEN only needed for private repos)
        required: false
        type: boolean
        default: false
      max-artifact-size-mb:
        description: Fail the build when an APK/AAB is larger than this many MB (0 disables the check)
        required: false
        type: number
        default: 0
      verify-signing:
        description: Verify the signature of the built APK/AAB before it is published
        required: false
        type: boolean
        default: true
      fail-on-placeholders:
        description: Fail when Google test ad unit IDs, com.example ids or debug signing are still in the release
        required: false
        type: boolean
        default: false
      check-version-bump:
        description: Fail when pubspec.yaml is not newer than the latest release tag
        required: false
        type: boolean
        default: false
      # ---------------------------------------------------------------
      # Build options
      # ---------------------------------------------------------------
      obfuscate:
        description: Build with --obfuscate --split-debug-info (Flutter release hardening)
        required: false
        type: boolean
        default: false
      upload-symbols:
        description: Upload the obfuscation symbols as a build artifact
        required: false
        type: boolean
        default: true
      split-per-abi:
        description: Build one APK per ABI instead of a single fat APK
        required: false
        type: boolean
        default: false
      build-web:
        description: Build a release web bundle and upload it as an artifact
        required: false
        type: boolean
        default: false
      deploy-web-pages:
        description: >-
          Deploy the web build to GitHub Pages (caller needs contents: write)
        required: false
        type: boolean
        default: false
      codegen:
        description: Code generation to run before validation (none, build_runner, gen-l10n, both)
        required: false
        type: string
        default: none
      use-fvm:
        description: Pin the Flutter version from the project .fvmrc file
        required: false
        type: boolean
        default: false
      test-matrix:
        description: >-
          Extra Flutter channels to validate, comma separated
          (for example stable,beta)
        required: false
        type: string
        default: ""
      # ---------------------------------------------------------------
      # Distribution
      # ---------------------------------------------------------------
      play-track:
        description: Google Play track for the AAB upload (empty disables the upload)
        required: false
        type: string
        default: ""
      play-package-name:
        description: Android package name used for the Google Play upload
        required: false
        type: string
        default: ""
      play-status:
        description: Google Play release status (completed, draft, halted, inProgress)
        required: false
        type: string
        default: completed
      firebase-groups:
        description: Firebase App Distribution groups (empty disables the upload)
        required: false
        type: string
        default: ""
      firebase-app-id:
        description: Firebase Android app id used for App Distribution
        required: false
        type: string
        default: ""
      pr-comment:
        description: Comment the build summary on the pull request
        required: false
        type: boolean
        default: false
      notify-webhook:
        description: Discord or Slack webhook URL that receives the build summary
        required: false
        type: string
        default: ""
    secrets:
      ANDROID_KEYSTORE_BASE64:
        description: Base64-encoded upload-keystore.jks (required for AAB or GitHub Release publishing)
        required: false
      KEYSTORE_PASSWORD:
        description: Android upload keystore password (required for AAB or GitHub Release publishing)
        required: false
      KEY_ALIAS:
        description: Android upload key alias (required for AAB or GitHub Release publishing)
        required: false
      KEY_PASSWORD:
        description: Android upload key password (required for AAB or GitHub Release publishing)
        required: false
      CODECOV_TOKEN:
        description: Codecov upload token (only needed for private repositories)
        required: false
      PLAY_SERVICE_ACCOUNT_JSON:
        description: Google Play service account JSON used for the AAB upload
        required: false
      FIREBASE_SERVICE_CREDENTIALS:
        description: Firebase service account credentials used for App Distribution
        required: false

jobs:
  validate-and-build:
    name: Validate and build Flutter app
    runs-on: ubuntu-latest
    timeout-minutes: 45

    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory }}

    env:
      HAS_ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

    steps:
      - name: Checkout caller project
        uses: actions/checkout@v5
        with:
          # Full history is required to compare against the previous release tag.
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}

      - name: Resolve Flutter version
        id: flutter-version
        run: |
          version=""
          if [ "${{ inputs.use-fvm }}" = "true" ]; then
            if [ -f .fvmrc ]; then
              version="$(python3 - <<'PYTHON'
          import json, re
          try:
              print(json.load(open(".fvmrc")).get("flutter", ""))
          except Exception:
              match = re.search(r'"flutter"\s*:\s*"([^"]+)"', open(".fvmrc").read())
              print(match.group(1) if match else "")
          PYTHON
          )"
            else
              echo "::warning::use-fvm is set but no .fvmrc file was found; using the ${{ inputs.flutter-channel }} channel."
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ -n "$version" ]; then
            echo "Using the Flutter version pinned in .fvmrc: $version"
          else
            echo "Using the ${{ inputs.flutter-channel }} Flutter channel."
          fi

      - name: Set up Flutter
        if: steps.flutter-version.outputs.version == ''
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ inputs.flutter-channel }}
          cache: true

      - name: Set up Flutter (version pinned by .fvmrc)
        if: steps.flutter-version.outputs.version != ''
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter-version.outputs.version }}
          cache: true

      - name: Show tool versions
        run: |
          flutter --version
          dart --version
          java -version

      - name: Verify Flutter project
        run: |
          test -f pubspec.yaml || {
            echo "pubspec.yaml was not found in: $PWD"
            echo "Set the working-directory input when the Flutter app is in a subdirectory."
            exit 1
          }

      - name: Generate Android platform when missing
        if: inputs.generate-android-platform
        run: |
          if [ ! -d android ]; then
            project_name="$(awk '/^name:/{print $2; exit}' pubspec.yaml)"
            temp_dir="$(mktemp -d)"
            flutter create \
              --platforms=android \
              --no-pub \
              --project-name "$project_name" \
              --org "${{ inputs.android-organization }}" \
              "$temp_dir/generated"
            cp -a "$temp_dir/generated/android" ./android
            rm -rf "$temp_dir"
            echo "Generated Android platform for $project_name."
          else
            echo "Android platform already exists; generation skipped."
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Run code generation
        if: inputs.codegen != 'none' && inputs.codegen != ''
        run: |
          case "${{ inputs.codegen }}" in
            build_runner|both)
              echo "Running build_runner build..."
              dart run build_runner build --delete-conflicting-outputs
              ;;
          esac
          case "${{ inputs.codegen }}" in
            gen-l10n|both)
              echo "Generating localizations..."
              flutter gen-l10n
              ;;
          esac
          echo "Code generation finished (${{ inputs.codegen }})."

      - name: Check Dart formatting
        if: inputs.run-format-check
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze source code
        if: inputs.run-analyze
        run: flutter analyze --fatal-infos

      - name: Run tests
        if: inputs.run-tests
        run: |
          if [ -d test ] && find test -type f -name '*_test.dart' -print -quit | grep -q .; then
            if [ "${{ inputs.code-coverage }}" = "true" ]; then
              echo "Running tests with coverage..."
              flutter test --coverage
            else
              flutter test
            fi
          else
            echo "No *_test.dart files found; test step skipped."
          fi

      - name: Report test coverage
        if: inputs.code-coverage && inputs.run-tests
        run: |
          if [ ! -f coverage/lcov.info ]; then
            echo "No coverage/lcov.info was produced; nothing to report."
            exit 0
          fi
          total="$(grep -c '^DA:' coverage/lcov.info || true)"
          hit="$(grep '^DA:' coverage/lcov.info | awk -F, '$2 > 0 {n++} END {print n + 0}' || true)"
          if [ "${total:-0}" -gt 0 ]; then
            pct="$(awk -v h="$hit" -v t="$total" 'BEGIN {printf "%.1f", h * 100 / t}')%"
          else
            pct="n/a"
          fi
          echo "Coverage: $hit / $total lines ($pct)"
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            {
              echo "### Test coverage"
              echo ""
              echo "| Lines covered | Coverage |"
              echo "|---|---|"
              echo "| $hit / $total | **$pct** |"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload coverage to Codecov
        if: inputs.code-coverage && inputs.upload-coverage-codecov && inputs.run-tests
        uses: codecov/codecov-action@v5
        with:
          files: ${{ inputs.working-directory }}/coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Check version bump against the last release
        if: inputs.check-version-bump
        run: |
          version="$(awk '/^version:/{print $2; exit}' pubspec.yaml)"
          if [ -z "$version" ]; then
            echo "::error::Could not read a version: line from pubspec.yaml."
            exit 1
          fi
          name="${version%%+*}"
          code="${version##*+}"
          last_tag="$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)"
          if [ -z "$last_tag" ]; then
            echo "No previous release tag found; nothing to compare against."
            exit 0
          fi
          prefix="$(git rev-parse --show-prefix)"
          last_pubspec="$(git show "$last_tag:${prefix}pubspec.yaml" 2>/dev/null || true)"
          last_version="$(printf '%s\n' "$last_pubspec" | awk '/^version:/{print $2; exit}')"
          if [ -z "$last_version" ]; then
            echo "Could not read pubspec.yaml from $last_tag; skipping the check."
            exit 0
          fi
          last_name="${last_version%%+*}"
          last_code="${last_version##*+}"
          echo "Current version: $name+$code"
          echo "Last release ($last_tag): $last_name+$last_code"
          failed=0
          case "$code" in
            ''|*[!0-9]*)
              echo "::error::pubspec.yaml has no numeric build number (expected version: name+code)."
              failed=1
              ;;
            *)
              if [ "$code" -le "$last_code" ]; then
                echo "::error::versionCode $code is not greater than $last_code. Play Store rejects an upload that does not raise versionCode."
                failed=1
              fi
              ;;
          esac
          if [ "$name" = "$last_name" ]; then
            echo "::error::versionName $name is unchanged since $last_tag."
            failed=1
          fi
          if [ "$failed" -ne 0 ]; then
            exit 1
          fi
          echo "pubspec.yaml is newer than $last_tag."

      - name: Detect release placeholders
        if: inputs.fail-on-placeholders
        run: |
          failed=0
          hits_file=/tmp/placeholder-hits.txt

          # grep exits 2 when a path does not exist even if it matched
          # elsewhere, so the exit status cannot be trusted here. Collect the
          # hits in a file and test that instead, and skip missing paths.
          check() {
            message="$1"
            pattern="$2"
            shift 2
            : > "$hits_file"
            for path in "$@"; do
              [ -e "$path" ] || continue
              grep -rniE "$pattern" "$path" >> "$hits_file" 2>/dev/null || true
            done
            if [ -s "$hits_file" ]; then
              echo "::error::$message"
              cat "$hits_file"
              failed=1
            else
              echo "OK: $message"
            fi
          }

          # Google's public test ad unit IDs must never reach a release build.
          check "A Google test ad unit ID (ca-app-pub-3940256099942544) is still in the source. Replace the AdMob test IDs with the real ones." \
            'ca-app-pub-3940256099942544' lib pubspec.yaml

          # Placeholder application ids left over from 'flutter create'.
          check "A placeholder application id (com.example.*) is still configured." \
            'com\.example\.' lib android/app/src android/app/build.gradle android/app/build.gradle.kts android/app/src/main/AndroidManifest.xml

          # A release signed with the debug key is installable but not publishable.
          : > "$hits_file"
          for path in android/app/build.gradle android/app/build.gradle.kts; do
            [ -e "$path" ] || continue
            grep -rniE 'signingConfig[[:space:]]*=[[:space:]]*signingConfigs\.getByName\("debug"\)' "$path" >> "$hits_file" 2>/dev/null || true
          done
          if [ -s "$hits_file" ]; then
            echo "::warning::The release build type can fall back to the debug signing key. Make sure a real upload key is configured before publishing."
            cat "$hits_file"
          fi

          if [ "$failed" -ne 0 ]; then
            echo "Placeholder check failed. Set fail-on-placeholders: false to override."
            exit 1
          fi
          echo "No release placeholders found."

      - name: Verify Android signing secrets
        if: inputs.build-aab || inputs.publish-github-release || env.HAS_ANDROID_KEYSTORE != ''
        env:
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS_VALUE: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD_VALUE: ${{ secrets.KEY_PASSWORD }}
        run: |
          missing=0
          [ -n "$HAS_ANDROID_KEYSTORE" ] || { echo "Missing secret: ANDROID_KEYSTORE_BASE64"; missing=1; }
          [ -n "$STORE_PASSWORD" ] || { echo "Missing secret: KEYSTORE_PASSWORD"; missing=1; }
          [ -n "$KEY_ALIAS_VALUE" ] || { echo "Missing secret: KEY_ALIAS"; missing=1; }
          [ -n "$KEY_PASSWORD_VALUE" ] || { echo "Missing secret: KEY_PASSWORD"; missing=1; }
          [ "$missing" -eq 0 ] || exit 1

      - name: Configure Android signing
        if: inputs.build-aab || inputs.publish-github-release || env.HAS_ANDROID_KEYSTORE != ''
        env:
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS_VALUE: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD_VALUE: ${{ secrets.KEY_PASSWORD }}
        run: |
          printf '%s' "$HAS_ANDROID_KEYSTORE" | base64 --decode > android/app/upload-keystore.jks
          {
            echo "storePassword=$STORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD_VALUE"
            echo "keyAlias=$KEY_ALIAS_VALUE"
            echo "storeFile=upload-keystore.jks"
          } > android/key.properties
          chmod 600 android/app/upload-keystore.jks android/key.properties

      - name: Configure generated Android Gradle signing
        if: (inputs.build-aab || inputs.publish-github-release || env.HAS_ANDROID_KEYSTORE != '') && inputs.generate-android-platform
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path

          kotlin_file = Path("android/app/build.gradle.kts")
          groovy_file = Path("android/app/build.gradle")

          if kotlin_file.exists():
              text = kotlin_file.read_text()
              if "import java.util.Properties" not in text:
                  text = "import java.util.Properties\nimport java.io.FileInputStream\n\n" + text
              setup = """val keystoreProperties = Properties()
          val keystorePropertiesFile = rootProject.file("key.properties")
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(FileInputStream(keystorePropertiesFile))
          }
          
          """
              signing = """    signingConfigs {
                  create("release") {
                      keyAlias = keystoreProperties["keyAlias"] as String?
                      keyPassword = keystoreProperties["keyPassword"] as String?
                      storeFile = keystoreProperties["storeFile"]?.let { file(it) }
                      storePassword = keystoreProperties["storePassword"] as String?
                  }
              }
          
          """
              if "val keystoreProperties = java.util.Properties()" not in text:
                  text = text.replace("android {", setup + "android {", 1)
              if 'create("release")' not in text:
                  text = text.replace("    buildTypes {", signing + "    buildTypes {", 1)
              text = text.replace(
                  'signingConfig = signingConfigs.getByName("debug")',
                  'signingConfig = signingConfigs.getByName("release")',
              )
              kotlin_file.write_text(text)
              if 'signingConfigs.getByName("release")' not in text:
                  raise SystemExit("Could not configure release signing in build.gradle.kts")
          elif groovy_file.exists():
              text = groovy_file.read_text()
              setup = """def keystoreProperties = new Properties()
          def keystorePropertiesFile = rootProject.file('key.properties')
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
          }
          
          """
              signing = """    signingConfigs {
                  release {
                      keyAlias keystoreProperties['keyAlias']
                      keyPassword keystoreProperties['keyPassword']
                      storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
                      storePassword keystoreProperties['storePassword']
                  }
              }
          
          """
              if "def keystoreProperties = new Properties()" not in text:
                  text = text.replace("android {", setup + "android {", 1)
              if "signingConfigs {" not in text:
                  text = text.replace("    buildTypes {", signing + "    buildTypes {", 1)
              text = text.replace(
                  "signingConfig signingConfigs.debug",
                  "signingConfig signingConfigs.release",
              )
              groovy_file.write_text(text)
              if "signingConfig signingConfigs.release" not in text:
                  raise SystemExit("Could not configure release signing in build.gradle")
          else:
              raise SystemExit("No Android app Gradle file was found")
          PYTHON

      - name: Prepare Dart defines and build environment
        if: inputs.build-apk || inputs.build-aab
        id: dart-defines
        env:
          DART_DEFINES_INPUT: ${{ inputs.dart-defines }}
          BUILD_ENV_INPUT: ${{ inputs.build-env }}
        run: |
          set -euo pipefail

          # Both inputs share one shape: KEY=VALUE per line, blank lines and
          # '#' comments ignored. Values are never echoed - they are not
          # secrets by design, but a caller may still not want them in logs.
          trim() {
            local s="${1%$'\r'}"
            s="${s#"${s%%[![:space:]]*}"}"
            printf '%s' "${s%"${s##*[![:space:]]}"}"
          }

          defines_file="$RUNNER_TEMP/dart-defines.txt"
          : > "$defines_file"
          define_keys=()
          while IFS= read -r raw || [ -n "$raw" ]; do
            line="$(trim "$raw")"
            [ -n "$line" ] && [ "${line:0:1}" != "#" ] || continue
            key="${line%%=*}"
            value="${line#*=}"
            if [ "$key" = "$line" ]; then
              echo "::error::dart-defines: '$line' is not KEY=VALUE."
              exit 1
            fi
            if ! [[ "$key" =~ ^[A-Za-z_][A-Za-z0-9_.]*$ ]]; then
              echo "::error::dart-defines: invalid name '$key' (letters, digits, '_' and '.' only)."
              exit 1
            fi
            if [ -z "$value" ]; then
              echo "::notice::dart-defines: $key is empty and was skipped; the app's compile-time default applies."
              continue
            fi
            printf '%s=%s\n' "$key" "$value" >> "$defines_file"
            define_keys+=("$key")
          done <<< "$DART_DEFINES_INPUT"

          # Gradle's fallback path (see the AAB step) needs the defines in the
          # form the Flutter tool hands to Gradle: base64 per entry, comma-joined.
          gradle_defines=""
          while IFS= read -r line; do
            gradle_defines="${gradle_defines:+$gradle_defines,}$(printf '%s' "$line" | base64 -w0)"
          done < "$defines_file"
          echo "gradle-dart-defines=$gradle_defines" >> "$GITHUB_OUTPUT"

          env_keys=()
          while IFS= read -r raw || [ -n "$raw" ]; do
            line="$(trim "$raw")"
            [ -n "$line" ] && [ "${line:0:1}" != "#" ] || continue
            key="${line%%=*}"
            value="${line#*=}"
            if [ "$key" = "$line" ]; then
              echo "::error::build-env: '$line' is not KEY=VALUE."
              exit 1
            fi
            if ! [[ "$key" =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]]; then
              echo "::error::build-env: invalid variable name '$key'."
              exit 1
            fi
            case "$key" in
              PATH|HOME|SHELL|CI|NODE_OPTIONS|GITHUB_*|RUNNER_*|ACTIONS_*)
                echo "::error::build-env: refusing to override protected variable '$key'."
                exit 1
                ;;
            esac
            if [ -z "$value" ]; then
              echo "::notice::build-env: $key is empty and was skipped."
              continue
            fi
            printf '%s=%s\n' "$key" "$value" >> "$GITHUB_ENV"
            env_keys+=("$key")
          done <<< "$BUILD_ENV_INPUT"

          join() { local out=""; for k in "$@"; do out="${out:+$out, }$k"; done; printf '%s' "${out:-none}"; }
          echo "Dart defines (values hidden): $(join "${define_keys[@]}")"
          echo "Build environment (values hidden): $(join "${env_keys[@]}")"
          {
            echo "## Build-time configuration"
            echo
            echo "- Dart defines: $(join "${define_keys[@]}")"
            echo "- Build environment: $(join "${env_keys[@]}")"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build release APK
        if: inputs.build-apk
        run: |
          dart_define_args=()
          while IFS= read -r line; do
            dart_define_args+=("--dart-define=$line")
          done < "$RUNNER_TEMP/dart-defines.txt"
          extra_args=()
          if [ "${{ inputs.split-per-abi }}" = "true" ]; then
            extra_args+=(--split-per-abi)
          fi
          if [ "${{ inputs.obfuscate }}" = "true" ]; then
            extra_args+=(--obfuscate --split-debug-info=build/symbols)
          fi
          flutter build apk --release ${extra_args[@]+"${extra_args[@]}"} "${dart_define_args[@]}"

      - name: Build signed release AAB
        if: inputs.build-aab
        env:
          GRADLE_DART_DEFINES: ${{ steps.dart-defines.outputs.gradle-dart-defines }}
        run: |
          dart_define_args=()
          while IFS= read -r line; do
            dart_define_args+=("--dart-define=$line")
          done < "$RUNNER_TEMP/dart-defines.txt"

          # TODO(revert): Workaround for the Flutter 3.44+ AAB strip regression
          # (flutter/flutter#186810 — "Release app bundle failed to strip debug
          # symbols from native libraries"). Once a STABLE Flutter release fixes
          # it, revert this step back to a single line:
          #     flutter build appbundle --release
          # and delete this comment. Verify by running a Manual Android Test
          # Build and confirming the AAB artifact is produced without the
          # "failed to strip debug symbols" error.
          #
          # Why the workaround is needed: Flutter 3.44+ has a broken AAB
          # strip/post-process step. Gradle's bundleRelease still produces a
          # valid .aab before that step fails, so let flutter run it (it may
          # fail at the strip) and then ensure the artifact exists by invoking
          # Gradle's bundleRelease directly, bypassing Flutter's broken wrapper.
          extra_args=()
          if [ "${{ inputs.obfuscate }}" = "true" ]; then
            extra_args+=(--obfuscate --split-debug-info=build/symbols)
          fi
          flutter build appbundle --release ${extra_args[@]+"${extra_args[@]}"} "${dart_define_args[@]}" || true
          # The fallback must receive the same defines, otherwise the bundle
          # would silently compile with the app's defaults (e.g. test ad units).
          test -f build/app/outputs/bundle/release/app-release.aab || (
            cd android && ./gradlew bundleRelease ${GRADLE_DART_DEFINES:+"-Pdart-defines=$GRADLE_DART_DEFINES"}
          )

      - name: Check artifact size limit
        if: inputs.build-apk || inputs.build-aab
        env:
          MAX_MB: ${{ inputs.max-artifact-size-mb }}
        run: |
          if [ "$MAX_MB" = "0" ] || [ -z "$MAX_MB" ]; then
            echo "No artifact size limit configured."
            exit 0
          fi
          failed=0
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            bytes="$(stat -c%s "$f")"
            mb="$(awk -v b="$bytes" 'BEGIN {printf "%.2f", b / 1048576}')"
            over="$(awk -v m="$mb" -v x="$MAX_MB" 'BEGIN {print (m > x) ? "yes" : "no"}')"
            if [ "$over" = "yes" ]; then
              echo "::error::$f is $mb MB, above the $MAX_MB MB limit."
              failed=1
            else
              echo "$f is $mb MB (limit $MAX_MB MB)."
            fi
          done < <(find build/app/outputs -type f \( -name '*.apk' -o -name '*.aab' \) 2>/dev/null)
          if [ "$failed" -ne 0 ]; then
            exit 1
          fi
          echo "All artifacts are within the size limit."

      - name: Verify release signing
        if: inputs.verify-signing && (inputs.build-apk || inputs.build-aab)
        run: |
          failed=0
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          apksigner="$(ls "$sdk"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1 || true)"
          found_apk=0
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            found_apk=1
            if [ -z "$apksigner" ]; then
              echo "::warning::apksigner was not found under $sdk/build-tools; cannot verify $f."
              continue
            fi
            echo "Verifying signature of $f"
            if "$apksigner" verify --print-certs "$f" > /tmp/apksigner.out 2>&1; then
              head -5 /tmp/apksigner.out
            else
              echo "::error::$f failed apksigner verification:"
              cat /tmp/apksigner.out
              failed=1
            fi
          done < <(find build/app/outputs -type f -name '*.apk' 2>/dev/null)
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            echo "Verifying signature of $f"
            if unzip -l "$f" 2>/dev/null | grep -qE 'META-INF/.*\.(RSA|DSA|EC)'; then
              echo "$f carries a signature in META-INF."
            else
              echo "::error::$f does not look signed (no META-INF signature)."
              failed=1
            fi
          done < <(find build/app/outputs -type f -name '*.aab' 2>/dev/null)
          if [ "$found_apk" -eq 0 ] && ! find build/app/outputs -type f -name '*.aab' 2>/dev/null | grep -q .; then
            echo "No APK or AAB was built; nothing to verify."
          fi
          if [ "$failed" -ne 0 ]; then
            exit 1
          fi
          echo "Release artifacts are signed."

      - name: Upload obfuscation symbols
        if: inputs.obfuscate && inputs.upload-symbols
        uses: actions/upload-artifact@v4
        with:
          name: debug-symbols
          path: ${{ inputs.working-directory }}/build/symbols
          if-no-files-found: warn
          retention-days: ${{ inputs.artifact-retention-days }}

      - name: Build web
        if: inputs.build-web
        run: flutter build web --release

      - name: Upload web artifact
        if: inputs.build-web
        uses: actions/upload-artifact@v4
        with:
          name: flutter-web
          path: ${{ inputs.working-directory }}/build/web
          retention-days: ${{ inputs.artifact-retention-days }}

      - name: Deploy web to GitHub Pages
        if: inputs.build-web && inputs.deploy-web-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ${{ inputs.working-directory }}/build/web

      - name: Upload APK artifact
        if: inputs.build-apk
        uses: actions/upload-artifact@v4
        with:
          name: android-release-apk
          path: ${{ inputs.working-directory }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: ${{ inputs.artifact-retention-days }}

      - name: Upload AAB artifact
        if: inputs.build-aab
        uses: actions/upload-artifact@v4
        with:
          name: android-release-aab
          path: ${{ inputs.working-directory }}/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: ${{ inputs.artifact-retention-days }}

      - name: Resolve distribution artifact
        id: distribution-file
        if: inputs.firebase-groups != '' || inputs.play-track != ''
        run: |
          chosen=""
          for candidate in \
            build/app/outputs/flutter-apk/app-release.apk \
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
            build/app/outputs/bundle/release/app-release.aab; do
            if [ -f "$candidate" ]; then
              chosen="$candidate"
              break
            fi
          done
          if [ -z "$chosen" ]; then
            echo "::error::No APK or AAB was found to distribute. Enable build-apk or build-aab."
            exit 1
          fi
          echo "file=$chosen" >> "$GITHUB_OUTPUT"
          echo "Distributing $chosen"

      - name: Upload to Firebase App Distribution
        if: inputs.firebase-groups != ''
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ inputs.firebase-app-id }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_CREDENTIALS }}
          groups: ${{ inputs.firebase-groups }}
          file: ${{ steps.distribution-file.outputs.file }}

      - name: Upload AAB to Google Play
        if: inputs.play-track != '' && inputs.build-aab
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ inputs.play-package-name }}
          releaseFiles: ${{ inputs.working-directory }}/build/app/outputs/bundle/release/app-release.aab
          track: ${{ inputs.play-track }}
          status: ${{ inputs.play-status }}

      - name: Prepare GitHub Release and English release notes
        if: inputs.publish-github-release
        id: prepare-release
        env:
          RELEASE_NAME_INPUT: ${{ inputs.release-name }}
          RELEASE_TAG_INPUT: ${{ inputs.release-tag }}
          BUILD_APK: ${{ inputs.build-apk }}
          BUILD_AAB: ${{ inputs.build-aab }}
        run: |
          python3 - <<'PYTHON'
          import hashlib
          import os
          import re
          import shutil
          import subprocess
          from pathlib import Path

          if os.environ["BUILD_APK"] != "true" and os.environ["BUILD_AAB"] != "true":
              raise SystemExit("publish-github-release requires build-apk and/or build-aab")

          pubspec = Path("pubspec.yaml").read_text(encoding="utf-8")
          version_match = re.search(r"^version:\s*['\"]?([^'\"\s]+)", pubspec, re.MULTILINE)
          name_match = re.search(r"^name:\s*['\"]?([^'\"\s]+)", pubspec, re.MULTILINE)
          if not version_match:
              raise SystemExit("No version entry was found in pubspec.yaml")

          full_version = version_match.group(1)
          version_name, separator, build_number = full_version.partition("+")
          if not re.fullmatch(r"\d+\.\d+\.\d+(?:[-.][0-9A-Za-z.-]+)?", version_name):
              raise SystemExit(f"Unsupported pubspec version name: {version_name}")
          if separator and not build_number.isdigit():
              raise SystemExit(f"The pubspec build number must be numeric: {build_number}")

          fallback_name = (name_match.group(1) if name_match else "Flutter App").replace("_", " ").title()
          product_name = os.environ["RELEASE_NAME_INPUT"].strip() or fallback_name
          if not product_name or "\n" in product_name or "\r" in product_name:
              raise SystemExit("release-name must be a non-empty single-line value")

          tag = os.environ["RELEASE_TAG_INPUT"].strip() or f"v{version_name}"
          if (
              not re.fullmatch(r"[0-9A-Za-z][0-9A-Za-z._/-]*", tag)
              or ".." in tag
              or tag.endswith(".")
              or tag.endswith("/")
          ):
              raise SystemExit(f"Unsafe or unsupported release tag: {tag}")

          filename_name = re.sub(r"[^0-9A-Za-z._-]+", "-", product_name).strip("-._") or "Flutter-App"
          asset_dir = Path(os.environ["RUNNER_TEMP"]) / "flutter-release-assets"
          if asset_dir.exists():
              shutil.rmtree(asset_dir)
          asset_dir.mkdir(parents=True)

          assets = []
          download_rows = []
          if os.environ["BUILD_APK"] == "true":
              source = Path("build/app/outputs/flutter-apk/app-release.apk")
              if not source.is_file():
                  raise SystemExit(f"Release APK was not found: {source}")
              target = asset_dir / f"{filename_name}-v{version_name}.apk"
              shutil.copy2(source, target)
              assets.append(target)
              download_rows.append((target.name, "Direct installation and testing on Android devices"))

          if os.environ["BUILD_AAB"] == "true":
              source = Path("build/app/outputs/bundle/release/app-release.aab")
              if not source.is_file():
                  raise SystemExit(f"Release AAB was not found: {source}")
              target = asset_dir / f"{filename_name}-v{version_name}.aab"
              shutil.copy2(source, target)
              assets.append(target)
              download_rows.append((target.name, "Upload to Google Play Console"))

          checksums = asset_dir / "SHA256SUMS.txt"
          checksums.write_text(
              "".join(
                  f"{hashlib.sha256(asset.read_bytes()).hexdigest()}  {asset.name}\n"
                  for asset in assets
              ),
              encoding="utf-8",
          )

          def git(*args):
              result = subprocess.run(
                  ["git", *args],
                  check=True,
                  text=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
              )
              return result.stdout.strip()

          previous_tag = ""
          for candidate in git("tag", "--merged", "HEAD", "--sort=-version:refname").splitlines():
              if candidate and candidate != tag:
                  previous_tag = candidate
                  break

          commit_range = f"{previous_tag}..HEAD" if previous_tag else "HEAD"
          log_output = git("log", "--no-merges", "--format=%H%x09%s", commit_range)
          commits = []
          for line in log_output.splitlines():
              if "\t" not in line:
                  continue
              sha, subject = line.split("\t", 1)
              subject = subject.strip()
              if subject:
                  commits.append((sha, subject))

          categories = {
              "features": [],
              "fixes": [],
              "performance": [],
              "maintenance": [],
              "documentation": [],
              "other": [],
          }
          prefix_pattern = re.compile(
              r"^(feat|feature|fix|bugfix|perf|performance|docs?|chore|build|ci|refactor|test|deps?)(?:\([^)]*\))?!?:\s*",
              re.IGNORECASE,
          )

          def classify(subject):
              lowered = subject.lower()
              match = prefix_pattern.match(subject)
              prefix = match.group(1).lower() if match else ""
              cleaned = prefix_pattern.sub("", subject).strip()
              cleaned = cleaned[:1].upper() + cleaned[1:] if cleaned else subject
              if prefix in {"feat", "feature"} or lowered.startswith(("add ", "implement ", "introduce ")):
                  return "features", cleaned
              if prefix in {"fix", "bugfix"} or lowered.startswith(("fix ", "resolve ", "correct ", "prevent ")):
                  return "fixes", cleaned
              if prefix in {"perf", "performance"} or "performance" in lowered:
                  return "performance", cleaned
              if prefix in {"doc", "docs"} or lowered.startswith(("document ", "update readme")):
                  return "documentation", cleaned
              if prefix in {"chore", "build", "ci", "refactor", "test", "dep", "deps"} or lowered.startswith(
                  ("bump ", "upgrade ", "update dependency", "release ")
              ):
                  return "maintenance", cleaned
              return "other", cleaned

          repository = os.environ["GITHUB_REPOSITORY"]
          server = os.environ.get("GITHUB_SERVER_URL", "https://github.com")
          seen = set()
          for sha, subject in commits:
              category, cleaned = classify(subject)
              dedupe_key = cleaned.casefold()
              if dedupe_key in seen:
                  continue
              seen.add(dedupe_key)
              categories[category].append(
                  f"- {cleaned} ([`{sha[:7]}`]({server}/{repository}/commit/{sha}))"
              )

          notes = [
              "## ✨ Release Overview",
              "",
              f"This release delivers the latest stable Android build of **{product_name}**, "
              "including recent improvements, fixes, and maintenance updates.",
              "",
          ]
          sections = [
              ("features", "🚀 New Features"),
              ("fixes", "🐛 Bug Fixes"),
              ("performance", "⚡ Performance Improvements"),
              ("maintenance", "🧰 Improvements and Maintenance"),
              ("documentation", "📝 Documentation"),
              ("other", "🔄 Other Changes"),
          ]
          wrote_changes = False
          for key, heading in sections:
              if categories[key]:
                  notes.extend([f"## {heading}", "", *categories[key], ""])
                  wrote_changes = True
          if not wrote_changes:
              notes.extend(["## 🔄 Changes", "", "- No user-facing changes were recorded for this release.", ""])

          notes.extend(
              [
                  "## 📦 Android Downloads",
                  "",
                  "| File | Purpose |",
                  "|---|---|",
                  *[f"| `{name}` | {purpose} |" for name, purpose in download_rows],
                  "| `SHA256SUMS.txt` | Verify downloaded files |",
                  "",
                  "## ℹ️ Build Information",
                  "",
                  f"- **Version:** `{version_name}`",
                  f"- **Build number:** `{build_number or 'not specified'}`",
                  f"- **Source commit:** [`{os.environ['GITHUB_SHA'][:7]}`]({server}/{repository}/commit/{os.environ['GITHUB_SHA']})",
                  "",
              ]
          )
          if previous_tag:
              notes.extend(
                  [
                      "## 🔗 Full Changelog",
                      "",
                      f"[{previous_tag}...{tag}]({server}/{repository}/compare/{previous_tag}...{tag})",
                      "",
                  ]
              )

          notes_file = asset_dir / "release-notes.md"
          notes_file.write_text("\n".join(notes).rstrip() + "\n", encoding="utf-8")

          output = Path(os.environ["GITHUB_OUTPUT"])
          with output.open("a", encoding="utf-8") as handle:
              handle.write(f"tag={tag}\n")
              handle.write(f"title={product_name} v{version_name}\n")
              handle.write(f"asset-dir={asset_dir}\n")
              handle.write(f"notes-file={notes_file}\n")

          print(notes_file.read_text(encoding="utf-8"))
          PYTHON

      - name: Publish GitHub Release
        if: inputs.publish-github-release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.prepare-release.outputs.tag }}
          RELEASE_TITLE: ${{ steps.prepare-release.outputs.title }}
          RELEASE_ASSET_DIR: ${{ steps.prepare-release.outputs.asset-dir }}
          RELEASE_NOTES_FILE: ${{ steps.prepare-release.outputs.notes-file }}
          RELEASE_DRAFT: ${{ inputs.release-draft }}
          RELEASE_PRERELEASE: ${{ inputs.release-prerelease }}
        run: |
          set -euo pipefail

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "A GitHub Release already exists for tag: $RELEASE_TAG" >&2
            echo "Increase the version in pubspec.yaml before publishing another release." >&2
            exit 1
          fi

          assets=(
            "$RELEASE_ASSET_DIR"/*.apk
            "$RELEASE_ASSET_DIR"/*.aab
            "$RELEASE_ASSET_DIR/SHA256SUMS.txt"
          )
          existing_assets=()
          for asset in "${assets[@]}"; do
            [ -f "$asset" ] && existing_assets+=("$asset")
          done
          [ "${#existing_assets[@]}" -gt 1 ] || {
            echo "No Android release asset was prepared." >&2
            exit 1
          }

          args=(
            release create "$RELEASE_TAG"
            --repo "$GITHUB_REPOSITORY"
            --target "$GITHUB_SHA"
            --title "$RELEASE_TITLE"
            --notes-file "$RELEASE_NOTES_FILE"
          )
          [ "$RELEASE_DRAFT" = "true" ] && args+=(--draft)
          [ "$RELEASE_PRERELEASE" = "true" ] && args+=(--prerelease)
          args+=("${existing_assets[@]}")

          if ! gh "${args[@]}"; then
            echo "GitHub Release publishing failed. Ensure the caller workflow grants 'contents: write'." >&2
            exit 1
          fi

          release_url="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json url --jq .url)"
          {
            echo "## GitHub Release published"
            echo
            echo "- Tag: \`$RELEASE_TAG\`"
            echo "- URL: $release_url"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build summary
        if: always()
        run: |
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            {
              echo "## Flutter build summary"
              echo
              echo "| | |"
              echo "|---|---|"
              echo "| Workflow | ${{ github.workflow }} |"
              echo "| Commit | \`${{ github.sha }}\` |"
              echo "| Job status | **${{ job.status }}** |"
              if [ -f coverage/lcov.info ]; then
                total="$(grep -c '^DA:' coverage/lcov.info || true)"
                hit="$(grep '^DA:' coverage/lcov.info | awk -F, '$2 > 0 {n++} END {print n + 0}' || true)"
                if [ "${total:-0}" -gt 0 ]; then
                  pct="$(awk -v h="$hit" -v t="$total" 'BEGIN {printf "%.1f", h * 100 / t}')%"
                else
                  pct="n/a"
                fi
                echo "| Coverage | $hit / $total lines ($pct) |"
              fi
              while IFS= read -r f; do
                [ -n "$f" ] || continue
                bytes="$(stat -c%s "$f")"
                mb="$(awk -v b="$bytes" 'BEGIN {printf "%.2f", b / 1048576}')"
                echo "| \`$(basename "$f")\` | $mb MB |"
              done < <(find build/app/outputs -type f \( -name '*.apk' -o -name '*.aab' \) 2>/dev/null | sort)
              echo
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Comment the summary on the pull request
        if: always() && inputs.pr-comment && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          SUMMARY_FILE: ${{ env.GITHUB_STEP_SUMMARY }}
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- flutter-builder-summary -->';
            let body = 'Flutter build finished.';
            if (process.env.SUMMARY_FILE && fs.existsSync(process.env.SUMMARY_FILE)) {
              body = fs.readFileSync(process.env.SUMMARY_FILE, 'utf8');
            }
            const text = `${marker}\n${body}`;
            const issueNumber = context.payload.pull_request.number;
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo,
              issue_number: issueNumber,
              per_page: 100,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: existing.id,
                body: text,
              });
            } else {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: issueNumber,
                body: text,
              });
            }

      - name: Notify webhook
        if: always() && inputs.notify-webhook != ''
        env:
          WEBHOOK_URL: ${{ inputs.notify-webhook }}
        run: |
          message="Flutter build ${{ job.status }} for ${{ github.repository }} @ ${{ github.ref_name }} (${{ github.sha }})"
          payload="$(WEBHOOK_URL="$WEBHOOK_URL" MESSAGE="$message" python3 - <<'PYTHON'
          import json, os
          print(json.dumps({"content": os.environ["MESSAGE"], "text": os.environ["MESSAGE"]}))
          PYTHON
          )"
          if curl -sS --fail-with-body -X POST -H 'Content-Type: application/json' -d "$payload" "$WEBHOOK_URL" > /tmp/webhook.out 2>&1; then
            echo "Webhook notified."
          else
            echo "::warning::Webhook notification failed:"
            cat /tmp/webhook.out
          fi

  # Optional second job: validate the same source against extra Flutter
  # channels so a breaking change on another channel is caught before release.
  prepare-matrix:
    name: Prepare Flutter channel matrix
    if: inputs.test-matrix != ''
    runs-on: ubuntu-latest
    outputs:
      channels: ${{ steps.channels.outputs.channels }}
    steps:
      - name: Build the channel list
        id: channels
        run: |
          raw="${{ inputs.test-matrix }}"
          case "$raw" in
            \[*)
              echo "channels=$raw" >> "$GITHUB_OUTPUT"
              ;;
            *)
              channels="$(python3 -c 'import json, sys; print(json.dumps([c.strip() for c in sys.argv[1].split(",") if c.strip()]))' "$raw")"
              echo "channels=$channels" >> "$GITHUB_OUTPUT"
              ;;
          esac
          echo "Channels to validate: ${{ inputs.test-matrix }}"

  matrix-validate:
    name: Validate on ${{ matrix.flutter-channel }}
    needs: prepare-matrix
    if: inputs.test-matrix != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        flutter-channel: ${{ fromJSON(needs.prepare-matrix.outputs.channels) }}
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checkout caller project
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ matrix.flutter-channel }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check Dart formatting
        if: inputs.run-format-check
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze source code
        if: inputs.run-analyze
        run: flutter analyze --fatal-infos

      - name: Run tests
        if: inputs.run-tests
        run: |
          if [ -d test ] && find test -type f -name '*_test.dart' -print -quit | grep -q .; then
            flutter test
          else
            echo "No *_test.dart files found; test step skipped."
          fi
