name: Flutter smoke test

# Exercises the toolchain that flutter-build.yml depends on (Flutter SDK,
# Java 17, Gradle/AGP) against a freshly generated Flutter app. The installer
# tests only cover scripts/install.sh; nothing else in this repository runs a
# real Flutter build, so an upstream change (new Flutter stable, new AGP
# default, broken Gradle cache) would first surface as a failure inside a
# user's app repository. This workflow catches that breakage here instead.
#
# The step order intentionally mirrors the reusable build job in
# flutter-build.yml (pub get -> format -> analyze -> test -> APK), so keeping
# the two in sync is a one-glance diff. That includes the Gradle cache: it is
# a dependency of the build job now, and an upstream change to
# gradle/actions/setup-gradle (or to the runner image it expects) should fail
# here, not inside a user's app repository.

# Manual only: no push or pull_request trigger. Run it from Actions -> Flutter
# smoke test -> Run workflow when you want it. The weekly schedule below is kept
# because it is not tied to a push: it catches upstream Flutter / Gradle /
# runner-image breakage before callers hit it.
on:
  schedule:
    - cron: "0 6 * * 0"
  workflow_dispatch:
    inputs:
      flutter-channel:
        description: Flutter channel to smoke test (stable, beta, or master)
        required: false
        type: string
        default: stable

permissions:
  contents: read

jobs:
  smoke:
    name: Fresh app through the build pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SMOKE_APP_DIR: smoke-app
    steps:
      - uses: actions/checkout@v5

      - name: Lint workflows with actionlint
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          # Info-level shellcheck notes (style, e.g. SC2012/SC2015) are not
          # gates here - same philosophy as the -S warning shellcheck step in
          # installer-tests.yml. Warnings and errors still fail the build.
          ./actionlint -color -ignore 'SC[0-9]+:info' .github/workflows/*.yml examples/project-workflows/*.yml

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ inputs.flutter-channel || 'stable' }}
          cache: true

      - name: Show tool versions
        run: |
          flutter --version
          dart --version
          java -version

      - name: Generate a fresh Flutter app
        run: |
          flutter create \
            --org dev.flutterbuilder.smoke \
            --project-name flutter_builder_smoke_app \
            "$SMOKE_APP_DIR"
          # flutter create ships a widget_test.dart, so flutter test has
          # something real to run below.

      - name: Install dependencies
        working-directory: ${{ env.SMOKE_APP_DIR }}
        run: flutter pub get

      - name: Check Dart formatting
        working-directory: ${{ env.SMOKE_APP_DIR }}
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze source code
        working-directory: ${{ env.SMOKE_APP_DIR }}
        run: flutter analyze --no-pub --fatal-infos

      - name: Run tests
        working-directory: ${{ env.SMOKE_APP_DIR }}
        run: flutter test --no-pub

      - name: Set up Gradle (dependency and wrapper cache)
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Build debug APK
        working-directory: ${{ env.SMOKE_APP_DIR }}
        run: flutter build apk --no-pub --debug

      - name: Verify the APK exists
        working-directory: ${{ env.SMOKE_APP_DIR }}
        run: |
          ls -lh build/app/outputs/flutter-apk/*.apk

  # Validates the screenshot pipeline end to end: a real Flutter web build, a
  # real static server, a real headless browser, and a PNG that must actually
  # be 390x844. Without this job the capture script would only be exercised the
  # first time a user's pull request calls ui-screenshots.yml.
  screenshots:
    name: Screenshot pipeline (web build)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SMOKE_WEB_DIR: smoke-web
    steps:
      - uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ inputs.flutter-channel || 'stable' }}
          cache: true

      - name: Generate a fresh Flutter app with web support
        run: |
          flutter create \
            --platforms=web \
            --org dev.flutterbuilder.smoke \
            --project-name flutter_builder_web_smoke_app \
            "$SMOKE_WEB_DIR"

      - name: Build web
        working-directory: ${{ env.SMOKE_WEB_DIR }}
        run: flutter build web --release

      - name: The pinned builder really ships the capture scripts
        # ui-screenshots.yml fetches the capture scripts by checking out
        # flutter-builder at the `ref:` written inside itself. A ref older than
        # the release that shipped the scripts clones fine and then dies at
        # capture time with exit 127 ("No such file or directory") - which is
        # exactly what v1.10.0 did, in nine repositories at once. Cloning the
        # pin here turns that into a legible failure in this repository.
        run: |
          set -euo pipefail
          pin="$(sed -n 's/^ *ref: \(v[0-9][0-9.]*\)$/\1/p' .github/workflows/ui-screenshots.yml | head -n1)"
          echo "ui-screenshots.yml checks out flutter-builder@$pin"
          test -n "$pin"
          git clone -q --depth 1 --branch "$pin" \
            https://github.com/Keshab1997/flutter-builder.git "$RUNNER_TEMP/builder-at-pin"
          for f in capture-screenshots.sh capture-pages.cjs embed-screenshots.sh; do
            test -f "$RUNNER_TEMP/builder-at-pin/scripts/$f" || {
              echo "::error::$pin does not contain scripts/$f - the pin is older than the release that shipped the screenshot pipeline"
              exit 1
            }
          done

      - name: Capture screenshots with the shipped script
        run: |
          bash scripts/capture-screenshots.sh \
            --build-dir "$SMOKE_WEB_DIR/build/web" \
            --out /tmp/ui-smoke \
            --routes / \
            --viewports 390x844 \
            --wait-ms 15000 \
            --max-wait-ms 60000 \
            --min-kb 5

      - name: Verify the screenshots really rendered
        run: |
          python3 - <<'PY'
          import pathlib
          import struct

          out = pathlib.Path("/tmp/ui-smoke")
          pngs = sorted(out.glob("*.png"))
          assert pngs, "no PNG was captured"

          # The manifest carries the decoded pixel statistics, because a solid
          # white 390x844 screenshot is 2.8 KB and a plain-but-correct page is
          # 4.4 KB - file size cannot tell "rendered" from "never painted".
          rows = [line.split("\t") for line in
                  (out / "manifest.tsv").read_text().splitlines() if line.strip()]
          assert rows, "the manifest is empty"
          for name, route, viewport, size, colors, share in rows:
              path = out / f"{name}.png"
              assert path.is_file(), f"{name}.png is missing"
              data = path.read_bytes()
              assert data[:8] == b"\x89PNG\r\n\x1a\n", f"{path} is not a PNG"
              # PNG IHDR: width and height are big-endian uint32 at 16 and 20.
              width, height = struct.unpack(">II", data[16:24])
              assert (width, height) == (390, 844), f"{path} is {width}x{height}"
              assert int(colors) > 2, (
                  f"{name} is a flat {colors}-colour screen: the app never painted. "
                  f"See the capture step above for console errors and WebGL state.")
              print(f"{name}.png: {width}x{height}, {int(size) // 1024} KB, "
                    f"{colors} colours (top colour {share})")
          PY

      - name: Build the summary table from the manifest
        # Same script the reusable workflow uses, run here so a manifest change
        # cannot silently break the step that only formats it.
        run: bash scripts/manifest-summary.sh /tmp/ui-smoke/manifest.tsv "Smoke run"

      - name: Upload what the pipeline produced
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-ui-screenshots
          path: /tmp/ui-smoke/*.png
          if-no-files-found: warn
