name: Flutter smoke test

# Exercises the toolchain that flutter-build.yml depends on (Flutter SDK,
# Java 17, Gradle/AGP) against a freshly generated Flutter app. The installer
# tests only cover scripts/install.sh; nothing else in this repository runs a
# real Flutter build, so an upstream change (new Flutter stable, new AGP
# default, broken Gradle cache) would first surface as a failure inside a
# user's app repository. This workflow catches that breakage here instead.
#
# The step order intentionally mirrors the reusable build job in
# flutter-build.yml (pub get -> format -> analyze -> test -> APK), so keeping
# the two in sync is a one-glance diff. That includes the Gradle cache: it is
# a dependency of the build job now, and an upstream change to
# gradle/actions/setup-gradle (or to the runner image it expects) should fail
# here, not inside a user's app repository.

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/flutter-build.yml
      - .github/workflows/flutter-smoke-test.yml
      - .github/workflows/preview-cleanup.yml
      - .github/workflows/publish-release.yml
      - .github/workflows/ui-screenshots.yml
      - .github/workflows/web-preview.yml
      - scripts/capture-screenshots.sh
  pull_request:
    paths:
      - .github/workflows/flutter-build.yml
      - .github/workflows/flutter-smoke-test.yml
      - .github/workflows/preview-cleanup.yml
      - .github/workflows/publish-release.yml
      - .github/workflows/ui-screenshots.yml
      - .github/workflows/web-preview.yml
      - scripts/capture-screenshots.sh
  schedule:
    # Weekly, even when nothing changes here: catches upstream Flutter /
    # Gradle / runner-image breakage before callers hit it.
    - cron: "0 6 * * 0"
  workflow_dispatch:
    inputs:
      flutter-channel:
        description: Flutter channel to smoke test (stable, beta, or master)
        required: false
        type: string
        default: stable

permissions:
  contents: read

jobs:
  smoke:
    name: Fresh app through the build pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SMOKE_APP_DIR: smoke-app
    steps:
      - uses: actions/checkout@v5

      - name: Lint workflows with actionlint
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          # Info-level shellcheck notes (style, e.g. SC2012/SC2015) are not
          # gates here - same philosophy as the -S warning shellcheck step in
          # installer-tests.yml. Warnings and errors still fail the build.
          ./actionlint -color -ignore 'SC[0-9]+:info' .github/workflows/*.yml examples/project-workflows/*.yml

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ inputs.flutter-channel || 'stable' }}
          cache: true

      - name: Show tool versions
        run: |
          flutter --version
          dart --version
          java -version

      - name: Generate a fresh Flutter app
        run: |
          flutter create \
            --org dev.flutterbuilder.smoke \
            --project-name flutter_builder_smoke_app \
            "$SMOKE_APP_DIR"
          # flutter create ships a widget_test.dart, so flutter test has
          # something real to run below.

      - name: Install dependencies
        working-directory: ${{ env.SMOKE_APP_DIR }}
        run: flutter pub get

      - name: Check Dart formatting
        working-directory: ${{ env.SMOKE_APP_DIR }}
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze source code
        working-directory: ${{ env.SMOKE_APP_DIR }}
        run: flutter analyze --no-pub --fatal-infos

      - name: Run tests
        working-directory: ${{ env.SMOKE_APP_DIR }}
        run: flutter test --no-pub

      - name: Set up Gradle (dependency and wrapper cache)
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Build debug APK
        working-directory: ${{ env.SMOKE_APP_DIR }}
        run: flutter build apk --no-pub --debug

      - name: Verify the APK exists
        working-directory: ${{ env.SMOKE_APP_DIR }}
        run: |
          ls -lh build/app/outputs/flutter-apk/*.apk

  # Validates the screenshot pipeline end to end: a real Flutter web build, a
  # real static server, a real headless browser, and a PNG that must actually
  # be 390x844. Without this job the capture script would only be exercised the
  # first time a user's pull request calls ui-screenshots.yml.
  screenshots:
    name: Screenshot pipeline (web build)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SMOKE_WEB_DIR: smoke-web
    steps:
      - uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ inputs.flutter-channel || 'stable' }}
          cache: true

      - name: Generate a fresh Flutter app with web support
        run: |
          flutter create \
            --platforms=web \
            --org dev.flutterbuilder.smoke \
            --project-name flutter_builder_web_smoke_app \
            "$SMOKE_WEB_DIR"

      - name: Build web
        working-directory: ${{ env.SMOKE_WEB_DIR }}
        run: flutter build web --release

      - name: Capture screenshots with the shipped script
        run: |
          bash scripts/capture-screenshots.sh \
            --build-dir "$SMOKE_WEB_DIR/build/web" \
            --out /tmp/ui-smoke \
            --routes / \
            --viewports 390x844 \
            --wait-ms 6000

      - name: Verify the PNG is a real 390x844 image
        run: |
          python3 - <<'PY'
          import pathlib
          import struct

          pngs = sorted(pathlib.Path("/tmp/ui-smoke").glob("*.png"))
          assert pngs, "no PNG was captured"
          for path in pngs:
              data = path.read_bytes()
              assert data[:8] == b"\x89PNG\r\n\x1a\n", f"{path} is not a PNG"
              # PNG IHDR: width and height are big-endian uint32 at 16 and 20.
              width, height = struct.unpack(">II", data[16:24])
              assert (width, height) == (390, 844), f"{path} is {width}x{height}"
              assert len(data) > 5000, f"{path} is suspiciously small ({len(data)} bytes)"
              print(f"{path.name}: {width}x{height}, {len(data) // 1024} KB")
          PY

      - name: Upload what the pipeline produced
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-ui-screenshots
          path: /tmp/ui-smoke/*.png
          if-no-files-found: warn
