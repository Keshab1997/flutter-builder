name: Reusable Publish Android Release

# Release-shaped defaults on top of flutter-build.yml, so a project wires this
# up in six lines instead of re-declaring fifteen inputs on every release path:
#
#   name: Publish Android Release
#   on:
#     workflow_dispatch:
#       inputs:
#         draft:     { description: Draft release?, type: boolean, default: false, required: false }
#         prerelease:{ description: Prerelease?,    type: boolean, default: false, required: false }
#   permissions:
#     contents: write
#   jobs:
#     publish:
#       uses: Keshab1997/flutter-builder/.github/workflows/publish-release.yml@v1.5.0
#       with:
#         app-name: SpeakEasy
#       secrets: inherit
#
# Nothing heavy lives here: building, signing, note generation, tagging and
# upload all stay in flutter-build.yml. Keep the @ref on this wrapper identical
# to the @ref in your other caller workflows — the two files ship together.
#
# Deliberately NOT here: auto-bumping pubspec.yaml. The build job checks out
# the SHA that triggered the run, so a bump committed during the run would not
# be what gets released. Bump in the PR that precedes the release (the way
# SpeakEasy does it: "chore: bump version to 1.0.36+36") — scripts/
# bump-pubspec-version.py in this repo prints the next version for you.

on:
  workflow_call:
    inputs:
      app-name:
        description: "Product name for the release title and asset filenames (empty = pubspec name)"
        required: false
        type: string
        default: ""
      build-apk:
        description: Attach a release APK to the GitHub Release
        required: false
        type: boolean
        default: true
      build-aab:
        description: Attach a signed release AAB to the GitHub Release
        required: false
        type: boolean
        default: true
      run-analyze:
        description: Fail the release if flutter analyze reports anything
        required: false
        type: boolean
        default: false
      run-tests:
        description: Fail the release if flutter test fails
        required: false
        type: boolean
        default: false
      run-format-check:
        description: Fail the release on Dart formatting drift
        required: false
        type: boolean
        default: false
      flutter-channel:
        description: Flutter channel used for the build
        required: false
        type: string
        default: stable
      java-version:
        description: Java version used for the Android build
        required: false
        type: string
        default: "17"
      working-directory:
        description: Flutter project directory inside the caller repository
        required: false
        type: string
        default: "."
      artifact-retention-days:
        description: Days to keep the uploaded APK/AAB workflow artifacts
        required: false
        type: number
        default: 30
      release-tag:
        description: "Override the tag (default: v<version-name> from pubspec.yaml)"
        required: false
        type: string
        default: ""
      release-draft:
        description: Create the GitHub Release as a draft
        required: false
        type: boolean
        default: false
      release-prerelease:
        description: Mark the GitHub Release as a prerelease
        required: false
        type: boolean
        default: false
      dart-defines:
        description: "Compile-time Dart defines, one KEY=VALUE per line (see flutter-build.yml)"
        required: false
        type: string
        default: ""
      build-env:
        description: "Environment variables for the build steps, one KEY=VALUE per line"
        required: false
        type: string
        default: ""
      google-services-json-base64:
        description: >-
          Base64 google-services.json written to <working-directory>/android/app
          before the build. Pass it from a repository secret so the Firebase
          client config never has to live in git. Empty is a no-op.
        required: false
        type: string
        default: ""
      google-services-plist-base64:
        description: "iOS equivalent of google-services-json-base64 (GoogleService-Info.plist). Empty is a no-op."
        required: false
        type: string
        default: ""
      fail-on-placeholders:
        description: "Fail the release when Google test ad unit IDs, com.example ids or debug signing are still in the source (on by default here)"
        required: false
        type: boolean
        default: true
      check-version-bump:
        description: "Fail the release when pubspec.yaml is not newer than the latest release tag (on by default here)"
        required: false
        type: boolean
        default: true
      verify-signing:
        description: "Verify the signature of the built APK/AAB before publishing"
        required: false
        type: boolean
        default: true
      obfuscate:
        description: "Build with --obfuscate --split-debug-info and upload the symbols"
        required: false
        type: boolean
        default: false
      split-per-abi:
        description: "Build one APK per ABI instead of a single fat APK"
        required: false
        type: boolean
        default: false
      max-artifact-size-mb:
        description: "Fail the release when an APK/AAB is larger than this many MB (0 disables the check)"
        required: false
        type: number
        default: 0
      code-coverage:
        description: "Run flutter test with coverage and report the percentage"
        required: false
        type: boolean
        default: false
      test-matrix:
        description: "Extra Flutter channels to validate, comma separated (for example stable,beta)"
        required: false
        type: string
        default: ""
      codegen:
        description: "Code generation to run before validation (none, build_runner, gen-l10n, both)"
        required: false
        type: string
        default: none
      use-fvm:
        description: "Pin the Flutter version from the project .fvmrc file"
        required: false
        type: boolean
        default: false
      pr-comment:
        description: "Comment the build summary on the pull request"
        required: false
        type: boolean
        default: false
      notify-webhook:
        description: "Discord or Slack webhook URL that receives the build summary"
        required: false
        type: string
        default: ""
      play-track:
        description: "Google Play track for the AAB upload (empty disables the upload)"
        required: false
        type: string
        default: ""
      play-package-name:
        description: "Android package name used for the Google Play upload"
        required: false
        type: string
        default: ""
      play-status:
        description: "Google Play release status (completed, draft, halted, inProgress)"
        required: false
        type: string
        default: completed
      firebase-groups:
        description: "Firebase App Distribution groups (empty disables the upload)"
        required: false
        type: string
        default: ""
      firebase-app-id:
        description: "Firebase Android app id used for App Distribution"
        required: false
        type: string
        default: ""
    secrets:
      ANDROID_KEYSTORE_BASE64:
        description: "Base64-encoded upload-keystore.jks — required for a signed AAB"
        required: false
      KEYSTORE_PASSWORD:
        description: Keystore password
        required: false
      KEY_ALIAS:
        description: Key alias
        required: false
      KEY_PASSWORD:
        description: Key password
        required: false
      CODECOV_TOKEN:
        description: Codecov upload token (only needed for private repositories)
        required: false
      PLAY_SERVICE_ACCOUNT_JSON:
        description: Google Play service account JSON used for the AAB upload
        required: false
      FIREBASE_SERVICE_CREDENTIALS:
        description: Firebase service account credentials used for App Distribution
        required: false
      GOOGLE_SERVICES_JSON_BASE64:
        description: "Base64 google-services.json written before the build. Secret alternative to the google-services-json-base64 input."
        required: false
      GOOGLE_SERVICES_PLIST_BASE64:
        description: "iOS equivalent of GOOGLE_SERVICES_JSON_BASE64 (GoogleService-Info.plist)"
        required: false

jobs:
  publish:
    name: Publish Android Release
    uses: Keshab1997/flutter-builder/.github/workflows/flutter-build.yml@v1.5.0
    with:
      flutter-channel: ${{ inputs.flutter-channel }}
      java-version: ${{ inputs.java-version }}
      working-directory: ${{ inputs.working-directory }}
      run-format-check: ${{ inputs.run-format-check }}
      run-analyze: ${{ inputs.run-analyze }}
      run-tests: ${{ inputs.run-tests }}
      build-apk: ${{ inputs.build-apk }}
      build-aab: ${{ inputs.build-aab }}
      artifact-retention-days: ${{ inputs.artifact-retention-days }}
      # The whole point of this wrapper: a release is always published.
      publish-github-release: true
      release-name: ${{ inputs.app-name }}
      release-tag: ${{ inputs.release-tag }}
      release-draft: ${{ inputs.release-draft }}
      release-prerelease: ${{ inputs.release-prerelease }}
      dart-defines: ${{ inputs.dart-defines }}
      build-env: ${{ inputs.build-env }}
      google-services-json-base64: ${{ inputs.google-services-json-base64 }}
      google-services-plist-base64: ${{ inputs.google-services-plist-base64 }}
      # Release safety nets. On by default for the release path: a release is
      # exactly the build you do not want to ship with test ad units or an
      # unchanged versionCode.
      fail-on-placeholders: ${{ inputs.fail-on-placeholders }}
      check-version-bump: ${{ inputs.check-version-bump }}
      verify-signing: ${{ inputs.verify-signing }}
      obfuscate: ${{ inputs.obfuscate }}
      split-per-abi: ${{ inputs.split-per-abi }}
      max-artifact-size-mb: ${{ inputs.max-artifact-size-mb }}
      code-coverage: ${{ inputs.code-coverage }}
      test-matrix: ${{ inputs.test-matrix }}
      codegen: ${{ inputs.codegen }}
      use-fvm: ${{ inputs.use-fvm }}
      pr-comment: ${{ inputs.pr-comment }}
      notify-webhook: ${{ inputs.notify-webhook }}
      play-track: ${{ inputs.play-track }}
      play-package-name: ${{ inputs.play-package-name }}
      play-status: ${{ inputs.play-status }}
      firebase-groups: ${{ inputs.firebase-groups }}
      firebase-app-id: ${{ inputs.firebase-app-id }}
    secrets:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
      FIREBASE_SERVICE_CREDENTIALS: ${{ secrets.FIREBASE_SERVICE_CREDENTIALS }}
      GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
      GOOGLE_SERVICES_PLIST_BASE64: ${{ secrets.GOOGLE_SERVICES_PLIST_BASE64 }}
