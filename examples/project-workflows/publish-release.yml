name: Publish Signed Android Release

# Wrapper-first form: the release policy lives in the builder repo, so this
# file barely changes between projects — point it at a new app, set the name,
# done. The older form (calling flutter-build.yml directly and spelling out
# every input) still works; manual-build.yml uses that shape.

on:
  workflow_dispatch:
    inputs:
      draft:
        description: Create the GitHub Release as a draft?
        required: false
        type: boolean
        default: false
      prerelease:
        description: Mark this as a prerelease?
        required: false
        type: boolean
        default: false
      upload_to_play_internal:
        description: Also upload the signed AAB to Google Play Internal testing?
        required: false
        type: boolean
        default: false
      package_name:
        description: Play package name override (leave blank to read applicationId from android/app/build.gradle)
        required: false
        type: string

permissions:
  contents: write

jobs:
  publish:
    uses: Keshab1997/flutter-builder/.github/workflows/publish-release.yml@v1.14.0
    with:
      app-name: My Flutter App
      # working-directory: apps/mobile   # if the app lives in a subfolder
      release-draft: ${{ inputs.draft }}
      release-prerelease: ${{ inputs.prerelease }}
      play-track: ${{ inputs.upload_to_play_internal && 'internal' || '' }}
      play-package-name: ${{ inputs.package_name }}
      # Release notes sit at the repository root, one whatsnew-<locale> file per
      # locale. This path is resolved against working-directory, so an app in a
      # subfolder has to step back out: '../distribution/whatsnew'. When the
      # directory is missing the run stops *before* the AAB reaches Play —
      # after that point the version code is spent and the build cannot be
      # reused.
      play-whats-new-directory: ${{ inputs.upload_to_play_internal && 'distribution/whatsnew' || '' }}
      play-status: completed
    secrets: inherit
