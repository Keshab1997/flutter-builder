name: Publish Android Release

# Wrapper-first form: the release policy lives in the builder repo, so this
# file barely changes between projects — point it at a new app, set the name,
# done. The older form (calling flutter-build.yml directly and spelling out
# every input) still works; manual-build.yml and release.yml use that shape.

on:
  workflow_dispatch:
    inputs:
      draft:
        description: Create the GitHub Release as a draft?
        required: false
        type: boolean
        default: false
      prerelease:
        description: Mark this as a prerelease?
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  publish:
    uses: Keshab1997/flutter-builder/.github/workflows/publish-release.yml@v1.1.0
    with:
      app-name: My Flutter App
      release-draft: ${{ inputs.draft }}
      release-prerelease: ${{ inputs.prerelease }}
    secrets: inherit
