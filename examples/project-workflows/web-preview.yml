name: Deploy Flutter Web Preview (GitHub Pages)

# Builds the app for the web and publishes it to GitHub Pages under
# preview/<slug>, so you can test the app by opening a URL in a browser
# instead of downloading and installing an APK.
#
# Automatically refreshes previews on relevant branch pushes. A same-repository
# open PR gets the URL comment updated from that push run, avoiding a duplicate
# build on pull_request.synchronize. Documentation/workflow-only changes are
# ignored; use Actions -> Run workflow for a one-off rebuild.
#
# One-time setup: Settings -> Pages -> Deploy from a branch -> gh-pages (root).
# The first run creates the gh-pages branch.
#
# Deleting a branch removes its preview again: the cleanup job below runs on the
# `delete` event, so gh-pages does not keep a web bundle for every dead branch.
# GitHub runs delete-triggered workflows from the default branch, so merge this
# file before relying on that.

on:
  push:
    branches:
      - '**'
      - '!gh-pages'
      - '!ui-screenshots'
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'distribution/**'
      - '.github/**'
      - 'LICENSE'
  workflow_dispatch:
  delete:

permissions:
  contents: write
  pull-requests: write

# All previews of one repository share a single lane, because they share one
# gh-pages branch. Every writer runs alone: the deploy action pushes with a
# compare-and-swap and refuses a push when another run moved the branch in the
# meantime ("cannot lock ref ... is expected"). Queueing also keeps a deleted
# branch's cleanup from cancelling, or being cancelled by, the deploy of the
# default branch.
concurrency:
  group: web-preview
  cancel-in-progress: false

jobs:
  preview:
    if: github.event_name != 'delete'
    uses: Keshab1997/flutter-builder/.github/workflows/web-preview.yml@v1.15.0
    with:
      # working-directory: apps/mobile   # if the app lives in a subfolder
      comment-on-pr: true
      # Keeps Settings -> About -> Website on the preview of the default branch.
      # Needs a credential with administration: write, which GITHUB_TOKEN is
      # not: the APP_PRIVATE_KEY secret + the app-id below, or an
      # ABOUT_LINK_TOKEN secret. Without one this changes nothing.
      set-about-link: true
      app-id: ${{ vars.APP_ID }}
    secrets: inherit

  cleanup:
    # A deleted tag is ignored inside the reusable workflow.
    if: github.event_name == 'delete' && github.event.ref_type == 'branch'
    uses: Keshab1997/flutter-builder/.github/workflows/preview-cleanup.yml@v1.15.0
    # A delete event leaves the event payload unreadable inside a called
    # workflow, so the caller hands the deleted ref over itself.
    with:
      branch-name: ${{ github.event.ref }}
    permissions:
      contents: write
