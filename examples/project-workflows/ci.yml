name: Flutter CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    uses: Keshab1997/flutter-builder/.github/workflows/flutter-build.yml@v1.1.0
    with:
      flutter-channel: stable
      run-format-check: true
      run-analyze: true
      run-tests: true
      build-apk: false
      build-aab: false
