name: Flutter CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  ci:
    uses: YOUR_USERNAME/flutter-builder/.github/workflows/flutter-build.yml@v1
    with:
      flutter-channel: stable
      run-format-check: true
      run-analyze: true
      run-tests: true
      build-apk: false
      build-aab: false
